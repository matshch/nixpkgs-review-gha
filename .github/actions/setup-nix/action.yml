name: setup-nix
description: set up Nix

inputs:
  system:
    type: string
    required: true
  sandbox:
    type: string
    default: "true"
  extra-nix-config:
    type: string
    default: ""
  builders:
    type: string
    default: ""
  ssh-key:
    type: string
    default: ""
  ssh-cert:
    type: string
    default: ""

runs:
  using: composite
  steps:
    - name: reclaim space (linux)
      if: runner.os == 'Linux' && inputs.system != 'riscv64-linux'
      uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874 # main
      with:
        hatchet-protocol: rampage

    # The riscv64 bootstrap gcc is a non-PIE executable linked at 0x10000.
    # Patching it while unpacking bootstrap-tools moves its first segment to
    # 0xf000, which is below Ubuntu's default vm.mmap_min_addr (65536), so gcc
    # segfaults immediately and nothing can be built from source.
    # Remove once nixpkgs ships PIE bootstrap tools:
    # https://github.com/NixOS/nixpkgs/issues/460825
    # https://github.com/NixOS/nixpkgs/pull/514892
    - name: lower vm.mmap_min_addr (riscv64)
      if: runner.os == 'Linux' && inputs.system == 'riscv64-linux'
      shell: bash
      run: |
        echo "vm.mmap_min_addr was $(sysctl -n vm.mmap_min_addr)"
        sudo sysctl -w vm.mmap_min_addr=4096 \
          || echo "::warning::could not lower vm.mmap_min_addr, building the riscv64 stdenv from source will fail"

    - name: reclaim space (darwin)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "::group::disk space (before)"
        sudo df -h
        echo "::endgroup::"

        echo "::group::disable mds"
        sudo mdutil -i off -a || echo "mdutil failed"
        sudo launchctl unload -w /System/Library/LaunchDaemons/com.apple.metadata.mds.plist \
         || echo "launchctl unload failed"
        echo "::endgroup::"

        echo "Background space expansion started. /nix will grow as space becomes available."
        sudo rm -rf \
          /Applications/Xcode_* \
          /Library/Developer/CoreSimulator \
          /Library/Frameworks \
          /Users/runner/.dotnet \
          /Users/runner/.rustup \
          /Users/runner/Library/Android \
          /Users/runner/Library/Caches \
          /Users/runner/Library/Developer/CoreSimulator \
          /Users/runner/hostedtoolcache &

    - name: prepare remote builder config
      if: ${{ inputs.builders != '' && inputs.ssh-key != '' }}
      env:
        BUILDERS: ${{ inputs.builders }}
        SSH_KEY: ${{ inputs.ssh-key }}
        SSH_CERT: ${{ inputs.ssh-cert }}
      shell: bash
      run: |
        set -euo pipefail
        sudo mkdir -p /etc/nix/
        echo -e "$BUILDERS" | sudo tee /etc/nix/machines
        echo -e "$SSH_KEY" | sudo tee /etc/nix/ssh_id > /dev/null
        echo -e "$SSH_CERT" | sudo tee /etc/nix/ssh_id-cert.pub > /dev/null
        sudo chmod 400 /etc/nix/ssh_id{,-cert.pub}

    - name: install nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        # Putting build-dir in /nix is a workaround for https://github.com/wimpysworld/nothing-but-nix/issues/18
        extra_nix_config: |
          accept-flake-config = true
          ${{ runner.os == 'Linux' && 'auto-allocate-uids = true' || '' }}
          build-dir = /nix/build
          builders = @/etc/nix/machines
          builders-use-substitutes = true
          extra-experimental-features = auto-allocate-uids cgroups flakes nix-command
          ${{ runner.os == 'Linux' && 'extra-system-features = uid-range' || '' }}
          sandbox = ${{ inputs.sandbox }}
          system = ${{ inputs.system }}
          ${{ inputs.extra-nix-config }}

    - name: create build-dir
      shell: bash
      run: sudo mkdir -p /nix/build

    - name: post setup-nix
      if: runner.os == 'macOS'
      uses: srz-zumix/post-run-action@42756f7452b9439d0365b7e087b2c364f54209c6 # v3.0.2
      with:
        shell: bash -e {0}
        post-run: |
          echo "::group::disk space (after)"
          sudo df -h
          echo "::endgroup::"
